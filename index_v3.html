<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线网页代理</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        p.subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            background-color: #3b82f6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button:hover {
            background-color: #2563eb;
        }
        button:active {
            background-color: #1d4ed8;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>在线网页代理</h1>
        <p class="subtitle">输入网址，即刻开始无限制浏览</p>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="例如: https://www.google.com" autocomplete="off" spellcheck="false">
            <button id="goBtn">访问</button>
        </div>
        <div class="footer">
            基于 Cloudflare Workers & jsproxy
        </div>
    </div>

    <script src="sw.js"></script>
    <script>
        // 如果当前处于代理模式，则不再显示首页
        if (location.pathname !== '/' && location.pathname !== '/index.html') {
            document.body.innerHTML = '';
            document.body.style.background = '#fff';
        }

        const input = document.getElementById('urlInput');
        const button = document.getElementById('goBtn');

        function handleGo() {
            let url = input.value.trim();
            if (!url) return;

            // 自动补全协议
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // 跳转到代理路径
            location.href = '/http/' + url;
        }

        button.addEventListener('click', handleGo);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleGo();
            }
        });

        // 自动聚焦输入框
        window.addEventListener('load', () => {
            if (location.pathname === '/' || location.pathname === '/index.html') {
                input.focus();
            }
        });
    </script>
</body>
</html>
